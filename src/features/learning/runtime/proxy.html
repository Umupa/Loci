<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head>
<body><iframe id="widget" title="Interactive explanation" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
<script>
(() => {
  "use strict";
  const frame = document.getElementById("widget");
  let rootPort;
  let token;
  const encode = (value) => JSON.stringify(value).replace(/</g, "\\u003c").replace(/\u2028/g, "\\u2028").replace(/\u2029/g, "\\u2029");

  function shim(initial, secret) {
    let state = initial.state;
    let theme = initial.theme;
    let tokens = initial.tokens;
    const stateListeners = new Set();
    const themeListeners = new Set();
    const send = (message) => parent.postMessage({ channel: "loci-widget-child", token: secret, message }, "*");
    const applyTheme = () => {
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      for (const property of ["--loci-background", "--loci-text", "--loci-accent", "--loci-font", "--loci-mono"]) {
        if (typeof tokens?.[property] === "string") document.documentElement.style.setProperty(property, tokens[property]);
      }
    };
    const clone = (value) => JSON.parse(JSON.stringify(value));
    Object.defineProperty(window, "loci", { value: Object.freeze({
      getState: () => clone(state),
      setState: (value) => { state = clone(value); send({ type: "state", state }); stateListeners.forEach((listener) => listener(clone(state))); },
      onState: (listener) => { stateListeners.add(listener); return () => stateListeners.delete(listener); },
      get theme() { return theme; },
      onTheme: (listener) => { themeListeners.add(listener); return () => themeListeners.delete(listener); },
      ask: (text) => send({ type: "ask", text, selection: String(window.getSelection() || "").slice(0, 2000) }),
      openSource: (id) => send({ type: "source", id }),
      resize: (height) => send({ type: "resize", height }),
    }), writable: false, configurable: false });
    window.addEventListener("message", (event) => {
      if (event.source !== parent || !event.data || event.data.token !== secret) return;
      const message = event.data.message;
      if (message.type === "state") {
        if (JSON.stringify(message.state) === JSON.stringify(state)) return;
        state = clone(message.state);
        stateListeners.forEach((listener) => listener(clone(state)));
      } else if (message.type === "theme") {
        theme = message.theme === "light" ? "light" : "dark";
        tokens = message.tokens;
        applyTheme();
        themeListeners.forEach((listener) => listener(theme));
      }
    });
    applyTheme();
    window.addEventListener("error", (event) => send({ type: "error", message: event.message || "The generated explanation could not run." }));
    window.addEventListener("unhandledrejection", (event) => send({ type: "error", message: String(event.reason) }));
    window.addEventListener("DOMContentLoaded", () => {
      const measure = () => send({ type: "resize", height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) });
      new ResizeObserver(measure).observe(document.body);
      measure();
      send({ type: "ready" });
    });
  }

  window.addEventListener("message", (event) => {
    if (event.source === parent && event.data?.type === "loci-widget-init" && event.ports.length === 1 && typeof event.data.html === "string") {
      rootPort?.close();
      rootPort = event.ports[0];
      token = Array.from(crypto.getRandomValues(new Uint8Array(16)), (byte) => byte.toString(16).padStart(2, "0")).join("");
      rootPort.onmessage = (message) => frame.contentWindow?.postMessage({ token, message: message.data }, "*");
      rootPort.start();
      const initial = { state: event.data.state ?? {}, theme: event.data.theme === "light" ? "light" : "dark", tokens: event.data.tokens };
      const policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";
      const style = `html{font:13px/1.65 var(--loci-font,system-ui,sans-serif);color-scheme:light dark;--loci-background:#f7f7f7;--loci-text:#2e2e2e;--loci-accent:#459df7;--loci-muted:color-mix(in srgb,var(--loci-text) 56%,var(--loci-background));--loci-border:color-mix(in srgb,var(--loci-text) 10%,var(--loci-background));--loci-surface:color-mix(in srgb,var(--loci-text) 4%,var(--loci-background))}
html[data-theme=dark]{--loci-background:#171717;--loci-text:#ebebeb}
*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--loci-background);color:var(--loci-text);overflow-wrap:anywhere}h1,h2,h3{margin:0 0 8px;font-weight:550;line-height:1.5;letter-spacing:-.015em}h1{font-size:18px}h2{font-size:16px}h3{font-size:14px}p{margin:0 0 12px}small{font-size:11px;color:var(--loci-muted)}a{color:var(--loci-accent);text-underline-offset:3px}button,input,select,textarea{font:inherit;color:inherit;border:1px solid var(--loci-border);border-radius:7px;background:var(--loci-surface)}button{min-height:30px;padding:5px 10px;cursor:pointer;transition:background .12s}button:hover:not(:disabled){background:color-mix(in srgb,var(--loci-text) 9%,var(--loci-background))}button:disabled{opacity:.4;cursor:default}input,select,textarea{padding:5px 8px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--loci-accent);outline-offset:2px}code,pre{font-family:var(--loci-mono,ui-monospace,monospace);font-size:.92em}pre{padding:12px;border-radius:8px;background:var(--loci-surface);overflow:auto}svg,canvas{max-width:100%}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 10px;border-bottom:1px solid var(--loci-border);text-align:left}th{font-weight:500;color:var(--loci-muted)}hr{border:0;border-top:1px solid var(--loci-border);margin:16px 0}@media(max-width:380px){body{padding:14px}}@media(prefers-reduced-motion:reduce){button{transition:none}}`;
      frame.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' + policy + '"><style>' + style + '</style><script>(' + shim.toString() + ')(' + encode(initial) + ',' + encode(token) + ');<\/script></head><body>' + event.data.html + '</body></html>';
      return;
    }
    if (event.source === frame.contentWindow && event.data?.channel === "loci-widget-child" && event.data.token === token) rootPort?.postMessage(event.data.message);
  });
})();
</script></body></html>
