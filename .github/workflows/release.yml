name: Release

# A tag v<x.y.z> builds Loci Dev.app for Apple silicon and Intel, signs it with
# the Developer ID in the MACOS_SIGNING_IDENTITY secret, notarizes it, and
# attaches the dmg to that tag's release. `gh workflow run release` does the
# same without releasing anything, to try the secrets; the dmg is kept as a
# workflow artifact. How the pieces fit: docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # A tag ships to people, so it is signed and notarized or it is not
      # released. A run started by hand is how the secrets are tried, and signs
      # ad hoc when there are none.
      - name: Check that a tag has the secrets to sign and notarize
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "No tag: this run builds and signs a dmg to try the secrets, and releases nothing."
            exit 0
          fi
          missing=()
          for name in MACOS_SIGNING_IDENTITY MACOS_SIGNING_PASSWORD \
            MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::A tag build must be signed and notarized, and these secrets are missing: ${missing[*]}. See docs/releasing.md."
            exit 1
          fi

      - name: Import the Developer ID identity
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "::warning::No MACOS_SIGNING_IDENTITY secret: script/release signs ad hoc and skips notarization."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_SIGNING_IDENTITY" | base64 --decode > "$RUNNER_TEMP/loci.p12"
          security import "$RUNNER_TEMP/loci.p12" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/loci.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_SIGNING_IDENTITY holds no Developer ID Application identity. Export the .p12 with its private key and certificate. See docs/releasing.md."
            exit 1
          fi
          echo "LOCI_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          LOCI_ARCHS: arm64 x86_64
          LOCI_BUILD: ${{ github.run_number }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          LOCI_RELAY_URL: ${{ secrets.LOCI_RELAY_URL }}
          LOCI_RELAY_KEY: ${{ secrets.LOCI_RELAY_KEY }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export LOCI_VERSION="${GITHUB_REF_NAME#v}"
          fi
          dmg="$(script/release)"
          echo "DMG=$dmg" >> "$GITHUB_ENV"
          echo "DMG_SHA256=$dmg.sha256" >> "$GITHUB_ENV"
          ls -l "$dmg" "$dmg.sha256"

      # α1-S10's budget is 500 ms. This records what the release build does and
      # never stops a release: a runner without a window session reports nothing.
      - name: Measure the cold start of the release build
        run: |
          script/measure-launch --runs 5 --app "output/Loci Dev.app" > output/launch.txt 2>&1 ||
            echo "the measurement failed; see above" >> output/launch.txt
          cat output/launch.txt
          {
            echo "### Cold start of the release build (budget 500 ms)"
            echo
            echo '```'
            cat output/launch.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the dmg and the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            output/*.dmg
            output/*.sha256
            output/launch.txt
          if-no-files-found: ignore

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ env.DMG }}
          DMG_SHA256: ${{ env.DMG_SHA256 }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          cat > "$notes" <<NOTES
          Loci Dev: the native app, still in alpha. It needs macOS 26 or later.

          Download the dmg, open it, and drag **Loci Dev** into Applications. It is signed with a Developer ID and notarized by Apple, so macOS opens it without asking.
          NOTES
          # An alpha tag is a pre-release; a rerun replaces the dmg it uploaded before.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$DMG" "$DMG_SHA256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG_SHA256" \
              --title "Loci Dev $GITHUB_REF_NAME" --notes-file "$notes" $prerelease
          fi
          gh release view "$GITHUB_REF_NAME" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the keychain
        if: always()
        run: if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN"; fi
