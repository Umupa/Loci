name: Release

# A tag v<x.y.z> made by script/cut-release runs the gate and, side by side on
# the same commit, builds Loci (Beta).app for Apple silicon and Intel, signs it
# with the identity in the MACOS_SIGNING_IDENTITY secret (notarized when that is
# a Developer ID), and makes the dmg. Only when both pass does Publish attach the
# dmg to that tag's release, with the version's CHANGELOG.md section as its
# notes. `gh workflow run release` does the same without releasing anything, to
# try the secrets; the dmg is kept as a workflow artifact. How the pieces fit:
# docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - uses: ./.github/actions/packages

      - name: Check
        run: script/check

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check
          path: |
            output/check-*.log
            output/snapshots
          if-no-files-found: ignore

  package:
    name: Package
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - uses: ./.github/actions/packages

      # A tag is cut by script/cut-release: on main, with its own CHANGELOG.md
      # section. Those notes are what the release says.
      - name: Check that the tag was cut from main, and read its notes
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Cut versions with script/cut-release on main. See docs/releasing.md."
            exit 1
          fi
          mkdir -p output
          script/changelog "$version" > output/changes.md

      # A tag ships to people, so it is signed with the identity every version
      # shares, or it is not released: macOS keeps the permissions an installed
      # copy was given only while the signature stays the same. A Developer ID
      # identity with the three notary secrets is also notarized; the
      # self-signed "Loci Signing" is not. A run started by hand tries the
      # secrets and signs ad hoc when there are none.
      - name: Check that a tag has the secrets to sign
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "No tag: this run builds and signs a dmg to try the secrets, and releases nothing."
            exit 0
          fi
          missing=()
          for name in MACOS_SIGNING_IDENTITY MACOS_SIGNING_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::A tag build must be signed, and these secrets are missing: ${missing[*]}. See docs/releasing.md."
            exit 1
          fi

      - name: Import the signing identity
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "::warning::No MACOS_SIGNING_IDENTITY secret: script/release signs ad hoc and skips notarization."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_SIGNING_IDENTITY" | base64 --decode > "$RUNNER_TEMP/loci.p12"
          security import "$RUNNER_TEMP/loci.p12" -k "$keychain" -P "$MACOS_SIGNING_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/loci.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$identity" ]]; then
            # A self-signed certificate signs code once it is trusted for it.
            security find-certificate -c "Loci Signing" -p "$keychain" > "$RUNNER_TEMP/loci.pem" || {
              echo "::error::MACOS_SIGNING_IDENTITY holds neither a Developer ID Application identity nor \"Loci Signing\". See docs/releasing.md."
              exit 1
            }
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/loci.pem"
            security find-identity -v -p codesigning "$keychain" | grep -q '"Loci Signing"'
            identity="Loci Signing"
          fi
          echo "LOCI_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and sign, and notarize with a Developer ID
        env:
          LOCI_ARCHS: arm64 x86_64
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          LOCI_RELAY_URL: ${{ secrets.LOCI_RELAY_URL }}
          LOCI_RELAY_KEY: ${{ secrets.LOCI_RELAY_KEY }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export LOCI_VERSION="${GITHUB_REF_NAME#v}"
          fi
          dmg="$(script/release)"
          if xcrun stapler validate "$dmg" > /dev/null 2>&1; then
            echo yes > output/notarized
          fi
          ls -l "$dmg" "$dmg.sha256"

      # The cold-start budget is 500 ms (α1-S10). This records what the release build does and
      # never stops a release: a runner without a window session reports nothing.
      - name: Measure the cold start of the release build
        run: |
          script/measure-launch --runs 5 --app "output/Loci (Beta).app" > output/launch.txt 2>&1 ||
            echo "the measurement failed; see above" >> output/launch.txt
          cat output/launch.txt
          {
            echo "### Cold start of the release build (budget 500 ms)"
            echo
            echo '```'
            cat output/launch.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # What Publish attaches, as it was signed here: Publish checks the dmg against
      # this checksum before it releases anything.
      - name: Keep the dmg, its notes and the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            output/*.dmg
            output/*.sha256
            output/changes.md
            output/notarized
            output/launch.txt
          if-no-files-found: ignore

      - name: Remove the keychain
        if: always()
        run: if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN"; fi

  publish:
    name: Publish
    needs: [check, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release
        run: |
          dmgs=(*.dmg)
          if [[ ${#dmgs[@]} -ne 1 || ! -f "${dmgs[0]}" || ! -f "${dmgs[0]}.sha256" || ! -f changes.md ]]; then
            echo "::error::Package left no single dmg with its checksum and notes."
            exit 1
          fi
          dmg="${dmgs[0]}"
          sha256sum --check "$dmg.sha256"
          notes="$RUNNER_TEMP/notes.md"
          cat changes.md > "$notes"
          {
            echo
            echo "---"
            echo
            echo "Loci needs macOS 26 or later. Download the dmg, open it, and drag **Loci (Beta)** into Applications."
            if [[ ! -f notarized ]]; then
              echo
              echo "Loci is not notarized by Apple. The first time you open it, macOS says it cannot check it for malicious software: open **System Settings → Privacy & Security** and choose **Open Anyway**, or run \`xattr -dr com.apple.quarantine \"/Applications/Loci (Beta).app\"\`."
            fi
          } >> "$notes"
          # A rerun replaces the dmg it uploaded before.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
              --verify-tag \
              --title "Loci (Beta) $GITHUB_REF_NAME" --notes-file "$notes"
          fi
          gh release view "$GITHUB_REF_NAME" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
