name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The commits this push or pull request adds: Conventional Commits, and a
      # CHANGELOG.md line for every feat and fix. Locally `script/check` checks
      # the commits not yet pushed.
      - name: Check the commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            echo "No earlier commit to compare with; nothing to check."
            exit 0
          fi
          script/check-commits "$BASE..$HEAD"

  # The code is built with Xcode 27. The compiler in the macos-26 image's Xcode 26 never finishes some of the
  # tests, so every macOS job runs on the xcode-27 image, which GitHub still calls a preview.
  check:
    name: Check
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check
        run: script/check

      - name: Keep the log and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            output/check.log
            output/snapshots
          if-no-files-found: ignore

  package:
    name: Dmg
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      # No secrets on a pull request: this runs the ad-hoc branch of script/release, which has to keep
      # producing a dmg. The signed and notarized one is built by the release workflow from a tag.
      - name: Build the dmg
        run: script/release

      - name: Keep the dmg
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            output/*.dmg
            output/*.sha256
          retention-days: 7
          if-no-files-found: error
