name: CI

on:
  push:
    branches: [native]
  pull_request:
    branches: [native]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Check
        run: script/check

      - name: Keep the log and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            output/check.log
            output/snapshots
          if-no-files-found: ignore
